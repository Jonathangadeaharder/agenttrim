[package]
name = "agenttrim"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.22"
thiserror = "2"
anyhow = "1"
dirs = "5"
rusqlite = { version = "0.31", features = ["bundled"] }
sysinfo = "0.33"
libc = "0.2"
walkdir = "2"
tar = "0.4"
flate2 = "1"

[dev-dependencies]
tempfile = "3"
